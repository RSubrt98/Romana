    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

    <nav class="nav">

            <li><a href="paintings.html" class="active"><span class="lang-cs">Obrazy</span><span class="lang-en">Paintings</span></a></li>

        </ul>
        <div class="nav-right">
            <button class="lang-btn" id="langBtn">EN</button>

    <main>

        <div class="page-header">

        <section class="paintings-section">
            <div class="container">
                <div class="paintings-grid" id="paintingsGrid"></div>
                <div class="pagination" id="pagination"></div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Romana Šubrtová</p>
        </div>
    </footer>

    <script>

      { id: 12, image: "images/paintings/painting-12.jpg", title: "Jeskyně",                         meta: "Olej na plátně · 90 × 90 cm · 2025",     sold: false },
      { id: 13, image: "images/paintings/painting-13.jpg", title: "Kachnička",                       meta: "Olej na plátně · 100 × 120 cm · 2025",   sold: false },
      { id: 14, image: "images/paintings/painting-14.jpg", title: "Krasobruslařka K. Osmond",        meta: "Olej na plátně · 120 × 140 cm · 2018",   sold: false },

      { id: 17, image: "images/paintings/painting-17.jpg", title: "Nebezpečné, dravé (Maska)",       meta: "Olej na plátně · 50 × 70 cm · 2026",     sold: false },

      { id: 28, image: "images/paintings/painting-28.jpg", title: "Strach 2",                        meta: "Olej na plátně · 50 × 70 cm · 2022",     sold: false },
      { id: 29, image: "images/paintings/painting-29.jpg", title: "Tereza s kočkou",                 meta: "Olej na plátně · 90 × 90 cm · 2024",     sold: false },
      { id: 30, image: "images/paintings/painting-30.jpg", title: "Ukrajina",                        meta: "Olej na plátně",                          sold: false },
      { id: 31, image: "images/paintings/painting-31.jpg", title: "Vodopád",                         meta: "Olej na plátně · 100 × 120 cm · 2025",   sold: false },
      { id: 32, image: "images/paintings/painting-32.jpg", title: "Výprava za světluškami",          meta: "Olej na plátně",                          sold: true  },
      { id: 33, image: "images/paintings/painting-33.jpg", title: "Vzteklá, zdivočelá (Maska)",      meta: "Olej na plátně · 50 × 70 cm · 2026",     sold: false },
      { id: 34, image: "images/paintings/painting-34.jpg", title: "Zpěvačka",                        meta: "Olej na plátně · 100 × 100 cm · 2025",   sold: false },
    ];

    const PER_PAGE = 12;
    const TOTAL_PAGES = Math.ceil(paintings.length / PER_PAGE);
    let currentPage = 1;

    function translateMeta(cs) {
        return cs
            .replace('Olej na plátně', 'Oil on canvas')
            .replace('Olej na desce', 'Oil on board');
    }

    function buildCard(p) {
        const imageHtml = p.image
            ? `<img src="${p.image}" alt="${p.title}">`
            : `<div class="placeholder-img">${p.id}</div>`;

        const priceHtml = p.sold
            ? `<span class="painting-sold"></span>`
            : `<span class="painting-price lang-cs">Na dotaz</span><span class="painting-price lang-en">On inquiry</span>`;

        return `
            <div class="painting-card">
                <div class="painting-image">${imageHtml}</div>
                <div class="painting-info">
                    <h3>${p.title}</h3>
                    <span class="painting-meta lang-cs">${p.meta}</span>
                    <span class="painting-meta lang-en">${translateMeta(p.meta)}</span>
                    ${priceHtml}
                </div>
            </div>`;
    }

    function render(page) {
        currentPage = page;
        const start = (page - 1) * PER_PAGE;
        const slice = paintings.slice(start, start + PER_PAGE);
        document.getElementById('paintingsGrid').innerHTML = slice.map(buildCard).join('');
        buildPagination();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function buildPagination() {
        const nav = document.getElementById('pagination');
        let html = `<button class="pg-btn pg-arrow" ${currentPage === 1 ? 'disabled' : ''} onclick="render(${currentPage - 1})">&#8592;</button>`;
        for (let i = 1; i <= TOTAL_PAGES; i++) {
            html += `<button class="pg-btn ${i === currentPage ? 'pg-active' : ''}" onclick="render(${i})">${i}</button>`;
        }
        html += `<button class="pg-btn pg-arrow" ${currentPage === TOTAL_PAGES ? 'disabled' : ''} onclick="render(${currentPage + 1})">&#8594;</button>`;
        nav.innerHTML = html;
    }

    render(1);
    </script>

    <script>
    (function() {
        var lang = localStorage.getItem('site-lang') || 'cs';
        document.documentElement.setAttribute('data-lang', lang);
        var langBtn = document.getElementById('langBtn');
        if (langBtn) {
            langBtn.textContent = lang === 'cs' ? 'EN' : 'CZ';
            langBtn.addEventListener('click', function() {
                lang = lang === 'cs' ? 'en' : 'cs';
                document.documentElement.setAttribute('data-lang', lang);
                localStorage.setItem('site-lang', lang);
                langBtn.textContent = lang === 'cs' ? 'EN' : 'CZ';
                render(currentPage);
            });
        }
        var navToggle = document.getElementById('navToggle');
        var nav = document.querySelector('.nav');
        if (navToggle) {
            navToggle.addEventListener('click', function() {
                nav.classList.toggle('nav-open');
                navToggle.setAttribute('aria-label', nav.classList.contains('nav-open') ? 'Zavřít menu' : 'Otevřít menu');
            });
            document.querySelectorAll('.nav-links a').forEach(function(link) {
                link.addEventListener('click', function() { nav.classList.remove('nav-open'); });
            });
        }
    })();
    </script>

</body>
</html>
